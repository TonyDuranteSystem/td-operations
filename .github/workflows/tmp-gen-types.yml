name: tmp-gen-types
on:
  push:
    branches: [fix/schema-types-drift]
jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: gen:types exactly as CI does
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SANDBOX_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SANDBOX_SERVICE_ROLE_KEY }}
        run: npm run gen:types
      - uses: actions/upload-artifact@v4
        with:
          name: types
          path: |
            lib/database.types.ts
            lib/db-check-types.ts
