# P1.8 — Server-side CI mirroring .husky/pre-push
#
# The pre-push hook runs only on developer machines. Any push that
# bypasses pre-push (git push --no-verify, CI deploy workflows, direct
# web UI edits) can still land a broken main. This workflow runs the
# same ESLint + unit + integration + build checks on every push to
# main and every pull request, giving GitHub's main a server-side
# floor independent of local hook state.
#
# Checks (all must pass):
#   1. Hardcoded client-facing domain check (same grep as pre-push)
#   2. ESLint on the full codebase (stricter than pre-push's
#      changed-files scope — CI catches anything pre-push skipped)
#   3. npm run test:unit
#   4. npm run test:integration (P1.7)
#   5. npm run build
#
# Not mirrored:
#   - Remote-sync check (CI IS the remote, doesn't apply)
#   - Node-version auto-select via nvm (CI uses setup-node instead)

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs for the same ref on new pushes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint + tests + build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Code↔PRODUCTION contract (the gate that would have caught 2026-07-14)
        # THE CHECK MUST BE AGAINST PRODUCTION'S RULES. That is the whole lesson.
        #
        # The code wrote a bank-feed status PRODUCTION's CHECK constraint forbade. Every write
        # was rejected; every error was discarded; the review queue silently did not exist for
        # months. It passed every test because SANDBOX had no such constraint — the harness was
        # validating against a database strictly more permissive than the one that rejects
        # writes. A green run against a more permissive database is not evidence.
        #
        # This step previously read production LIVE, which required a production Postgres
        # password as a repo secret. That secret was never set, so the step warned and exited 0
        # — a green checkmark enforcing nothing, which is worse than no check at all because it
        # manufactures the feeling of coverage. And the secret was a bad idea on its own terms:
        # a new production credential, in a place any workflow that can read secrets could use,
        # created so CI could read a list of allowed strings.
        #
        # So production's rules are COMMITTED (db/constraints.prod.json) and checksum-verified
        # against the database that produced them. This gate is a file comparison: no
        # credential, no network, cannot be skipped, cannot be faked (editing the snapshot
        # breaks its checksum).
        #
        # The stale-snapshot hole is closed at runtime, not here: lib/db-contract-monitor.ts
        # re-reads LIVE production daily from inside the app (which already has legitimate
        # access) and raises a dev-board job the moment the file and reality disagree.
        run: npm run check:db-contract

      - name: Sandbox still enforces what production enforces
        # The pre-push hook, the integration harness and every local test run against SANDBOX.
        # All of that is worthless if sandbox does not enforce production's rules — which is
        # exactly what happened: sandbox had ZERO constraints on td_bank_feeds while production
        # had three, so the harness went 32/32 green on writes production was rejecting.
        #
        # This asserts sandbox has not drifted from production's committed snapshot on any
        # registered contract. It uses the SANDBOX secrets that ALREADY EXIST for the schema
        # drift check below — no new credential, and deliberately never production's.
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SANDBOX_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SANDBOX_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$NEXT_PUBLIC_SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::warning::Sandbox secrets not set — sandbox/production parity NOT verified. The code↔production gate above still ran (it needs no credential)."
            exit 0
          fi
          npm run check:db-contract:live

      - name: Schema types drift (P2.5 — server-side, the gate pre-push can't enforce)
        # The pre-push hook SKIPS this check when the Supabase CLI is offline /
        # unauthenticated (most local pushes), which is how stale lib/database.types.ts
        # reached main (agent_message_party missing slack/code_runner, 2026-06-27).
        # CI has a token, so it regenerates from prod and fails on drift.
        #
        # Requires repo secret SUPABASE_ACCESS_TOKEN (Supabase dashboard → Account →
        # Access Tokens). Until it's set this step WARNS (visibly) instead of failing,
        # so it can't block PRs before setup; once set, it ENFORCES.
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          # gen:types also runs scripts/gen-check-types.ts, which introspects a DB via
          # exec_sql for lib/db-check-types.ts. Locally that hits the dev's .env.local
          # (sandbox by default), so CI uses sandbox too to reproduce the committed file.
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SANDBOX_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SANDBOX_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::warning::SUPABASE_ACCESS_TOKEN secret not set — schema-drift check SKIPPED. Add the secret to enforce."
            exit 0
          fi
          npm run gen:types
          if ! git diff --quiet lib/database.types.ts lib/db-check-types.ts; then
            echo "::error::DB types are stale. Run 'npm run gen:types' locally and commit lib/database.types.ts + lib/db-check-types.ts."
            git diff --stat lib/database.types.ts lib/db-check-types.ts
            exit 1
          fi
          echo "✅ Schema types in sync."

      - name: Block hardcoded client-facing domains
        # Mirrors .husky/pre-push lines 20-39. Only lib/config.ts,
        # lib/oauth.ts, lib/mcp/instructions.ts, .well-known, and the
        # QB OAuth callback paths are allowed to reference the internal
        # vercel domain.
        run: |
          set -e
          HARDCODED=$(grep -rn "td-operations\.vercel\.app\|offerte\.tonydurante\.us" \
            --include="*.ts" --include="*.tsx" lib/ app/ 2>/dev/null \
            | grep -v "node_modules" \
            | grep -v "lib/config.ts" \
            | grep -v "lib/oauth.ts" \
            | grep -v "lib/mcp/instructions.ts" \
            | grep -v ".well-known" \
            | grep -v "qb/authorize" \
            | grep -v "qb/callback" || true)
          if [ -n "$HARDCODED" ]; then
            echo "::error::Hardcoded client-facing domain found. Use APP_BASE_URL from lib/config.ts instead."
            echo "$HARDCODED"
            exit 1
          fi

      - name: ESLint (full codebase — errors fail; legacy warnings allowed)
        # Uses `lint:ci` (no --max-warnings 0) so 141 pre-existing warnings
        # don't fail CI. Pre-push + lint-staged still enforce max-warnings 0
        # on CHANGED files, per R067: warnings get cleaned up incrementally
        # as their files are touched. If you want CI strict-mode again,
        # switch to `npm run lint` — but first run it locally and fix every
        # warning (count today: 141).
        run: npm run lint:ci

      - name: Unit tests
        run: npm run test:unit

      - name: Integration tests (P1.7 characterization)
        run: npm run test:integration

      - name: Build
        # Next.js's static prerender phase eagerly invokes route handlers
        # and page modules. Modules that instantiate Supabase clients at
        # load time (via createBrowserClient / createServerClient) throw
        # "supabaseUrl is required" when NEXT_PUBLIC_SUPABASE_URL is
        # unset — which cascades into downstream false-positive
        # "no response returned from route handler" errors on unrelated
        # routes (e.g. /portal/manifest.webmanifest) and fails the build.
        #
        # Vercel's build environment already has these vars set, which
        # is why prod builds green. We provide dummy placeholder values
        # here so Supabase client init succeeds; no real network calls
        # happen during static prerender, so fake URLs are safe. The
        # EXPECTED_SUPABASE_REF assertion in lib/supabase-admin.ts is
        # intentionally NOT set here (it only fires when present).
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://ci-dummy.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_ci_dummy_placeholder
          SUPABASE_SERVICE_ROLE_KEY: sb_secret_ci_dummy_placeholder
